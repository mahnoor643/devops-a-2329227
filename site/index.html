<!DOCTYPE html>
<html>
<head>
    <title>Mahnoor - Student Portfolio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #333;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 50px auto;
        }

        .profile {
            background: white;
            padding: 40px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #6c5ce7;
            margin-bottom: 10px;
        }

        .seat {
            color: #666;
            margin-bottom: 30px;
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
        }

        ul {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        li {
            background: #6c5ce7;
            color: white;
            padding: 12px 20px;
            border-radius: 25px;
        }

        /* Responsive Design */
        @media (max-width: 600px) {

            .container {
                width: 95%;
                margin: 30px auto;
            }

            .profile {
                padding: 25px 15px;
            }

            h1 {
                font-size: 28px;
            }

            ul {
                flex-direction: column;
                align-items: center;
            }

            li {
                width: 80%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="profile">

            <h1>Mahnoor Tariq</h1>

            <p class="seat">Seat Number: 2329227</p>
            <p class="seat">Roll Number: JUW32820</p>

            <h2>Technical Skills</h2>

            <ul>
                <li>HTML</li>
                <li>CSS</li>
                <li>JavaScript</li>
                <li>Bootstrap</li>
                 <li>Git and GitHub</li>
            </ul>

        </div>

    </div>

</body>
</html>
